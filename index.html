<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf3e6">
<script>
  // Apply the saved theme before the page draws, so it never flashes the
  // wrong colours. js/theme.js keeps it up to date afterwards.
  (function () {
    var choice = 'auto';
    try { choice = JSON.parse(localStorage.getItem('laladoku.v2')).settings.theme || 'auto'; } catch (e) {}
    var dark = choice === 'dark' || (choice === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<meta name="description" content="Laladoku: a calm logic puzzle starring Lala, an orange tabby cat. One cat in every row, column and colour, and no two cats touch.">
<title>Laladoku</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Laladoku">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght,SOFT@9..144,500..800,100&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<main id="app" class="app"></main>
<div id="sheet" class="sheet" hidden></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
